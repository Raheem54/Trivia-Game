<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link href="css/styles.css" rel="stylesheet">
        <title>Trivia Game</title>
    </head>

    <body>
        <div class="container vh-100">
            <div class="d-flex p-5 mb-4 flex-lg-row perant">
                <div class='bg-light m-4 category-card rounded-4 p-3 shadow' id="gen">
                    <img src="assets/general knowledge.jpg" class='w-100' alt="General Knowledge">
                    <h3 class='text-center'>General Knowledge</h3>
                </div>
                <div class='bg-light m-4 category-card rounded-4 p-3 shadow' id="sports">
                    <img src="assets/sports.jpg" class='w-100' alt="Sports">
                    <h3 class='text-center'>Sports</h3>
                </div>
                <div class='bg-light m-4 category-card rounded-4 p-3 shadow' id="films">
                    <img src="assets/filmes.jpg" class='w-100' alt="Films">
                    <h3 class='text-center'>Films</h3>
                </div>
                <div class='bg-light m-4 category-card rounded-4 p-3 shadow' id="games">
                    <img src="assets/video games.jpg" class='w-100' alt="video games">
                    <h3 class='text-center'>video games</h3>
                </div>
            </div>
            <div class="bg-light m-3 rounded-4 shadow d-none p-4 main">
                <h2 class="px-3">Score : <span class="fw-bold text-success" id="score">0</span></h2>
                <h2 class="mb-3" id="qust"></h2>
                <button class=" btn btn-info mb-4 text-start w-100 option"></button>
                <button class=" btn btn-info mb-4 text-start w-100 option"></button>
                <button class=" btn btn-info mb-4 text-start w-100 option"></button>
                <button class=" btn btn-info mb-4 text-start w-100 option"></button>
                <button class=" btn btn-warning mt-3 text-center w-100 d-none" id="next">Next</button>
            </div>
        </div>
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>
    </body>

</html>
